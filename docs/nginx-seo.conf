# nginx configuration for stocksfundamentals.online
#
# ---------------------------------------------------------------------------
# READ THIS BEFORE APPLYING
#
# This file is a reference, not a drop-in replacement for your live config. It
# was written from the outside (by observing HTTP responses) because the live
# nginx config is not in this repository. Your real file almost certainly has
# TLS paths, logging and other directives that are not reproduced here.
#
# Apply it by merging the marked blocks into your existing server block, then:
#
#     sudo nginx -t          # must pass before you reload
#     sudo nginx -s reload
#
# A mistake here takes the whole site offline, so test the config first and
# keep a copy of the working file. The `location` ordering below matters: nginx
# matches exact and prefix locations before regex ones.
# ---------------------------------------------------------------------------

# --- 1. Canonical host: redirect www to the apex -----------------------------
#
# Currently www.stocksfundamentals.online and stocksfundamentals.online both
# return 200 with byte-identical bodies, so every page exists at two hostnames
# with nothing telling Google which is authoritative.

server {
    listen 80;
    listen 443 ssl;
    server_name www.stocksfundamentals.online;

    # ssl_certificate / ssl_certificate_key: keep your existing paths here.

    return 301 https://stocksfundamentals.online$request_uri;
}

# --- 2. Redirect plain HTTP to HTTPS ----------------------------------------

server {
    listen 80;
    server_name stocksfundamentals.online;
    return 301 https://stocksfundamentals.online$request_uri;
}

# --- 3. Main server block ---------------------------------------------------

server {
    listen 443 ssl http2;
    server_name stocksfundamentals.online;

    root /var/www/stock-analyses-react/dist;
    index index.html;

    # ssl_certificate / ssl_certificate_key: keep your existing paths here.

    # --- Security headers ---------------------------------------------------
    #
    # None of these were present. HSTS is the one that matters most for a
    # finance site: without it, the initial http:// hop is interceptable.
    #
    # Start with a short HSTS max-age. Only raise it to 31536000 and add
    # `preload` once you are certain every subdomain can serve HTTPS forever,
    # because preload is very hard to undo.
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Content-Security-Policy. Allows Google Fonts, inline styles (the app sets
    # style attributes from JS) and the inline theme bootstrap script.
    # Test this in a browser console before trusting it: a CSP that is too
    # strict breaks the app silently.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'self'; frame-ancestors 'self'" always;

    # --- Compression --------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css text/markdown application/javascript
               application/json application/xml image/svg+xml;

    # --- /index.html is a duplicate of / ------------------------------------
    location = /index.html {
        return 301 https://stocksfundamentals.online/;
    }

    # --- Legacy .html URLs from the old static site -------------------------
    #
    # BUG FOUND 2026-10-10, FIX NOT YET APPLIED TO THE LIVE CONFIG.
    #
    # The live server carries a rule from the old static site that rewrites any
    # /<name>.html to /analysis/<name>. That is right for articles and wrong for
    # the five static pages, which have no /analysis/ equivalent:
    #
    #   /about.html      -> 301 -> /analysis/about      -> 404
    #   /contact.html    -> 301 -> /analysis/contact    -> 404
    #   /disclaimer.html -> 301 -> /analysis/disclaimer -> 404
    #   /privacy.html    -> 301 -> /analysis/privacy    -> 404
    #
    # This is not theoretical. Search Console shows /about.html still indexed,
    # and over the 92 days to 2026-10-06 it took the only organic click the site
    # received. That click now lands on a 404.
    #
    # These four exact-match blocks must come BEFORE the regex rule, because
    # nginx matches an exact `location =` ahead of any regex.
    location = /about.html      { return 301 https://stocksfundamentals.online/about; }
    location = /contact.html    { return 301 https://stocksfundamentals.online/contact; }
    location = /disclaimer.html { return 301 https://stocksfundamentals.online/disclaimer; }
    location = /privacy.html    { return 301 https://stocksfundamentals.online/privacy; }

    # Article .html URLs keep redirecting into /analysis/, which is correct and
    # already works (/nalco-down-root-cause-jun16.html lands on a live page).
    # Keep whatever rule the live config already uses for those; it only needed
    # the four exceptions above. If it does not exist yet, this is the shape:
    #
    #   location ~ ^/(?<slug>[a-z0-9-]+)\.html$ {
    #       return 301 https://stocksfundamentals.online/analysis/$slug;
    #   }

    # --- Prerendered analysis pages -----------------------------------------
    #
    # scripts/generate-og-files.py writes dist/analysis/{slug}.html. Serve that
    # file when it exists; a slug with no file is a real 404, not the SPA shell.
    location ^~ /analysis/ {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # --- Raw Markdown -------------------------------------------------------
    #
    # /analyses/{slug}.md was served as application/octet-stream. It is the only
    # machine-readable copy of the content, so give it the right type. Agents
    # find it through the <link rel="alternate"> tag in each prerendered page.
    location ^~ /analyses/ {
        default_type text/markdown;
        add_header Content-Type "text/markdown; charset=utf-8" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    # --- Hashed build assets ------------------------------------------------
    #
    # Filenames contain a content hash, so a one-year immutable cache is safe.
    #
    # NOTE: this replaces a config that emitted TWO Cache-Control header lines
    # ("max-age=604800" and "public, immutable"), most likely an `expires`
    # directive plus an `add_header` both firing. Behaviour across intermediate
    # caches is undefined when that happens. Emit exactly one combined value,
    # and do not add an `expires` directive here as well.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # --- Plain-text discovery files -----------------------------------------
    #
    # These must never fall through to the SPA. A probe that asks for llms.txt
    # and receives an HTML page records a malformed file, which is worse than a
    # clean 404.
    location = /robots.txt   { default_type text/plain; try_files $uri =404; }
    location = /llms.txt     { default_type text/plain; try_files $uri =404; }
    location = /llms-full.txt { default_type text/plain; try_files $uri =404; }
    location = /sitemap.xml  { default_type application/xml; try_files $uri =404; }

    # --- Prerendered company hubs -------------------------------------------
    #
    # generate-og-files.py writes dist/company/{ticker}.html for the 155 hubs
    # the sitemap lists. Serve that when it exists.
    #
    # The remaining ~470 tickers have no prerendered file and fall through to
    # index.html, where CompanyPage renders them with `noindex, follow`. They
    # must NOT 404: a reader following an old link should still see the page.
    location ^~ /company/ {
        try_files $uri.html /index.html;
    }

    # --- Prerendered static pages -------------------------------------------
    #
    # Each has its own dist/{route}.html with a real title, description and
    # canonical. Without these, a non-JS crawler received the generic site title.
    location = /about      { try_files /about.html /index.html; }
    location = /contact    { try_files /contact.html /index.html; }
    location = /disclaimer { try_files /disclaimer.html /index.html; }
    location = /privacy    { try_files /privacy.html /index.html; }

    # --- Remaining SPA routes -----------------------------------------------
    #
    # Only these paths are real client-side routes, so only these get the SPA
    # shell. Everything else must 404.
    location = /                { try_files /index.html =404; }
    location = /watchlist       { try_files /index.html =404; }
    location = /watchlists      { try_files /index.html =404; }

    # --- Everything else is a 404 -------------------------------------------
    #
    # This is the important change. nginx previously fell back to index.html for
    # every unmatched path, so /this-does-not-exist returned HTTP 200 with the
    # SPA shell. Google classifies those as soft 404s and will crawl an
    # unlimited number of them.
    #
    # Serve real files if they exist (favicon, og-default.png, manifest, and so
    # on), otherwise 404.
    location / {
        try_files $uri =404;
    }

    # Render the SPA's own 404 page body, while still returning status 404.
    #
    # NOTE: this must NOT be written as `location = /index.html` - that block is
    # already claimed above by the 301 to /. nginx rejects the pair with
    # "duplicate location" at `nginx -t` time, so the file as previously written
    # could not be applied at all. A dedicated internal path avoids the clash.
    error_page 404 /_spa404.html;
    location = /_spa404.html {
        internal;
        try_files /index.html =404;
    }
}

# ---------------------------------------------------------------------------
# After reloading, verify from the outside:
#
#   # 404, not 200
#   curl -s -o /dev/null -w '%{http_code}\n' https://stocksfundamentals.online/nope-12345
#
#   # 301 to the apex
#   curl -s -o /dev/null -w '%{http_code} %{redirect_url}\n' https://www.stocksfundamentals.online/
#
#   # text/markdown, not application/octet-stream
#   curl -sI https://stocksfundamentals.online/analyses/policy-pulse-global-08-oct-2026.md | grep -i content-type
#
#   # exactly one Cache-Control line
#   curl -sI https://stocksfundamentals.online/assets/index-*.js | grep -ci cache-control
#
#   # security headers present
#   curl -sI https://stocksfundamentals.online/ | grep -iE 'strict-transport|x-content-type|referrer-policy'
#
#   # prerendered body actually shipped
#   curl -s -A Googlebot https://stocksfundamentals.online/ | wc -c
# ---------------------------------------------------------------------------
