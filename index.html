<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" sizes="48x48" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="alternate" type="application/rss+xml" title="StocksFundamentals — latest research" href="/rss.xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- No-JS fallback head tags. Every route that is not prerendered is served
         this file, so these must stay generic. Per-page title, description and
         canonical come from react-helmet-async; prerendered analysis pages get
         their own from scripts/generate-og-files.py.
         Keep this wording identical to HomePage.tsx so the two never disagree. -->
    <title>StocksFundamentals — Indian Stock Research &amp; Global Macro</title>
    <meta name="description" content="Independent deep-dive research on Indian stocks - NSE delivery data, promoter trends, quarterly results - plus daily US and global macro for investors holding both.">
    <meta property="og:title" content="StocksFundamentals — Indian Stock Research &amp; Global Macro">
    <meta property="og:description" content="Independent deep-dive research on Indian stocks - NSE delivery data, promoter trends, quarterly results - plus daily US and global macro for investors holding both.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="StocksFundamentals">
    <meta property="og:locale" content="en_IN">
    <!-- The WebSite/Person/Organization graph lives in HomePage.tsx. It must not
         be here: this file is served for ~400 URLs, and a WebSite block on every
         company and article URL describes the wrong thing. -->
    <!-- Search Console verification: add the real token via DNS or a meta tag
         here. The previous placeholder ("YOUR_VERIFICATION_CODE") was shipped to
         production and verified nothing, so it was removed. -->
    <!-- Self-hosted Inter (AGENTS.md 7.11). One variable woff2 covers 400/600/700.
         Preloaded so the fetch starts with the document rather than after the CSS
         that declares it. 7.9 had already made the old Google Fonts stylesheet
         non-blocking; self-hosting removes its two third-party origins as well.
         Keep this identical to render_shell() in scripts/generate-og-files.py --
         the homepage head comes from this file and every prerendered route's
         from that one. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-latin-var.woff2" crossorigin>
    <script>
      try {
        // Light is the default, full stop. This used to fall back to the OS
        // preference, which meant a reader whose phone is in dark mode saw the
        // old dark site with the neon accent and no visible change from 7.15.
        // Dark is now opt-in only: the toggle writes sf-theme-v2.
        const saved = localStorage.getItem('sf-theme-v2');
        document.documentElement.dataset.theme = saved === 'dark' ? 'dark' : 'light';
      } catch {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
